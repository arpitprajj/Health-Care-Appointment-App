services:
  payment-service:
    image: healthcare/payment-service:1.0
    build: ./payment-service
    container_name: payment-service
    ports: [ "5008:5008" ]
    depends_on:
      mysql: { condition: service_healthy }
      eureka-server: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/payment_db
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER: http://eureka-server:8761/eureka
      RAZORPAY_KEY: rzp_test_TB6bfoxsqUvFGj
      RAZORPAY_SECRET: jO25wtrElKdMSBqQ2qhGnycr
    restart: unless-stopped
    networks: [ healthcare-network ]

networks:
  healthcare-network:
    external: true
