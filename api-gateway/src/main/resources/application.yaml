server:
  port: 5000
jwt:
  secret: b7f3a9c2d1e4f6a8b9c0d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
spring:
  application:
    name: API-GATEWAY

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**


        - id: patient-service
          uri: lb://PATIENT-SERVICE
          predicates:
            - Path=/api/patients/**

          filters:
            - JwtAuthenticationFilter

        - id: doctor-service
          uri: lb://DOCTOR-SERVICE
          predicates:
            - Path=/api/doctors/**

          filters:
            - JwtAuthenticationFilter

        - id: slot-service
          uri: lb://SLOT-SERVICE
          predicates:
            - Path=/api/slots/**
          filters:
            - JwtAuthenticationFilter

        - id: appointment-service
          uri: lb://APPOINTMENT-SERVICE
          predicates:
            - Path=/api/appointments/**
          filters:
            - JwtAuthenticationFilter

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/appointments/**
          filters:
            - JwtAuthenticationFilter

logging:
  level:
    org.springframework.cloud.gateway: TRACE