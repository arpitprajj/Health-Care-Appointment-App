spring.application.name=appointment-service
server.port=5007
#spring.datasource.url=jdbc:mysql://localhost:3306/appointment
#spring.datasource.username=root
#spring.datasource.password=12345
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/appointment}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
logging.level.root=INFO
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.cloud.openfeign.httpclient.hc5.enabled=true
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
#logging.level.org.springframework.boot.autoconfigure=DEBUG
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

##### Circuit Breaker

resilience4j.circuitbreaker.instances.patientService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.patientService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.patientService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.patientService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.patientService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.patientService.minimumNumberOfCalls=5

resilience4j.circuitbreaker.instances.slotService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.slotService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.slotService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.slotService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.slotService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.slotService.minimumNumberOfCalls=5

resilience4j.circuitbreaker.instances.doctorService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.doctorService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.doctorService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.doctorService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.doctorService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.doctorService.minimumNumberOfCalls=5


