#### circuit breaker
resilience4j.circuitbreaker.instances.doctorService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.doctorService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.doctorService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.doctorService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.doctorService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.doctorService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.doctorService.automaticTransitionFromOpenToHalfOpenEnabled=true


resilience4j.circuitbreaker.instances.patientService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.patientService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.patientService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.patientService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.patientService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.patientService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.patientService.automaticTransitionFromOpenToHalfOpenEnabled=true

