services:
  auth-service:
    image: healthcare/auth-service:1.0
    build: ./auth-service
    container_name: auth-service
    ports: [ "5006:5006" ]
#    depends_on:
#      mysql: { condition: service_healthy }
#      eureka-server: { condition: service_started }
    environment:
      DB_URL: jdbc:mysql://mysql:3306/auth_db
      DB_USERNAME: root
      DB_PASSWORD: root
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka
      JWT_SECRET: b7f3a9c2d1e4f6a8b9c0d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a3
    restart: unless-stopped
    networks: [ healthcare-network ]

networks:
  healthcare-network:
    external: true